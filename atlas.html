  .lg2 .n{font-family:var(--mono);font-size:.68rem;color:var(--mute)}
  .mp-card{position:absolute;left:12px;bottom:12px;z-index:2;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:240px;max-width:320px;box-shadow:0 12px 30px -14px rgba(20,32,46,.35)}
  .mp-card h4{font-family:var(--display);font-size:1.2rem;margin:0} .mp-card h4 small{font-family:var(--mono);font-weight:400;font-size:.66rem;color:var(--mute);margin-left:6px}
  .mp-card .ty-pair{margin:6px 0} .mp-card .tr{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
  .mp-card .go{display:flex;gap:10px;font-size:.8rem} .mp-card .go button,.mp-card .go a{color:var(--accent);background:none;border:0;font:inherit;font-size:.8rem;cursor:pointer;padding:0}
  .mp-card .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:1rem;color:var(--mute);cursor:pointer}
  .mp-note{position:absolute;right:12px;bottom:12px;z-index:2;font-size:.7rem;color:var(--mute);background:rgba(255,255,255,.85);padding:4px 8px;border-radius:8px;max-width:280px;text-align:right}
  .maplibregl-popup-content{font:inherit;font-size:.8rem;padding:6px 10px;border-radius:10px} .maplibregl-popup-content b{font-family:var(--label)}
  .ty-chip.ty-p.lean{background:#fff;border:1px dashed #9db4dc;color:var(--accent2)}
  dialog{border:1px solid var(--line);border-radius:18px;padding:22px 24px;max-width:640px;width:calc(100% - 32px);box-shadow:0 20px 60px -20px rgba(20,32,46,.4)} dialog::backdrop{background:rgba(20,32,46,.35)}
  .unit-q{font:inherit;font-size:.72rem;border:1px solid var(--line);background:none;color:var(--mute);border-radius:999px;padding:1px 8px;cursor:pointer;vertical-align:middle} .unit-q:hover{color:var(--ink)}
  #unitBody table{border-collapse:collapse;width:100%;font-size:.85rem;margin:8px 0} #unitBody td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top} #unitBody p{font-size:.88rem;line-height:1.6}
  dialog h3{font-family:var(--display);margin:0 0 10px;font-size:1.2rem}
  dialog table{width:100%;border-collapse:collapse;font-size:.84rem} dialog td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top} dialog td:first-child{white-space:nowrap;font-weight:700}
  dialog .x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:1.1rem;cursor:pointer;color:var(--mute)}
  .kbd{font-family:var(--mono);font-size:.64rem;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--mute)}
  @media (max-width:980px){ .sp{grid-template-columns:1fr} .sp::before{display:none} .sp-l{flex-direction:row;align-items:center;padding:16px} .sp-l .sil{width:150px;flex:none} .sp-loc{flex:1} .sp-code{display:none} .sp-r{padding:18px 18px 20px} .sp-r h2{font-size:1.9rem} .dxbars{grid-template-columns:1fr} .inst{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:760px){ .dx-app{grid-template-columns:1fr} .dx-rail{position:fixed;top:var(--top-h);left:0;bottom:0;width:min(88vw,340px);z-index:6;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(20,32,46,.25)} .dx-app.rail-open .dx-rail{transform:none} .tbtn.rail-toggle{display:inline-block} .prog span{display:none} .dx-top h1 small{display:none} .dx-top{gap:6px;padding:0 8px} .dx-top h1{font-size:1rem} .tbtn .lbl{display:none} .tbtn .ico{display:inline!important} .tbtn{padding:5px 9px} .seg button{padding:5px 8px} .dx-book{padding:12px 10px 60px} .types{grid-template-columns:1fr} #rnd span{display:none} .mp-ctl{max-width:calc(100% - 24px)} }
</style>
</head>
<body>
<div class="dx-app" id="app">
  <header class="dx-top">
    <button class="tbtn rail-toggle" id="railBtn" aria-label="목록">☰</button>
    <h1><span data-ui="title">🧭 AidPage Atlas</span><small id="ver"></small> <button type="button" class="unit-q" id="unitBtn" data-ui="unit.q">왜 256장?</button></h1>
    <div class="seg" id="viewSeg"><button data-view="book">📖 <span data-ui="v.book">카드</span></button><button data-view="map">🗺️ <span data-ui="v.map">지도</span></button></div>
    <button class="tbtn" id="rnd" data-ui-title="rnd.t">🎲 <span data-ui="rnd">아무 장이나</span></button>
    <span class="sp"></span>
    <div class="prog" data-ui-title="prog.t"><i id="progBar"></i><span id="progTxt"></span></div>
    <button class="tbtn" id="langBtn" title="한국어 / English">EN</button>
    <button class="tbtn" id="dictBtn"><span class="lbl" data-ui="dict">타입 사전</span><span class="ico" hidden>?</span></button>
    <a class="tbtn" href="./" data-ui-title="home"><span class="lbl" data-ui="home">← 본 사이트</span><span class="ico" hidden>←</span></a>
  </header>
  <aside class="dx-rail" id="rail">
    <div class="dxq"><input id="q" type="search" data-ui-ph="q" placeholder="시·군·구 검색 (예: 진안, 관악)" autocomplete="off"></div>
    <div class="flt">
      <details open><summary><span data-ui="f.prim">자연 위해</span> <b id="nPrim"></b></summary><div class="row" id="fPrim"></div></details>
      <details><summary><span data-ui="f.basis">근거</span> <b id="nBasis"></b></summary><div class="row" id="fBasis"></div></details>
      <details><summary><span data-ui="f.soc">사회 위해</span> <b id="nSoc"></b></summary><div class="row" id="fSoc"></div></details>
      <details><summary><span data-ui="f.trait">특징</span> <b id="nTrait"></b></summary><div class="row" id="fTrait"></div></details>
      <details><summary><span data-ui="f.inst">제도·조례</span> <b id="nInst"></b></summary><div class="row" id="fInst"></div></details>
      <details><summary><span data-ui="f.thr">국가 지원 문턱</span> <b id="nThr"></b></summary><div class="row" id="fThr"></div></details>
      <details id="methodBox"><summary><span data-ui="mb">방법 보기 · 심사자용</span> <b id="nSpec"></b></summary><div class="mb"><label><span data-ui="mb.q">임계</span> <select id="specQ"><option value="p70">p70/p75</option><option value="p75" selected>p75/p80</option><option value="p80">p80/p85</option><option value="p7575">p75/p75</option></select></label><label><span data-ui="mb.u">단위</span> <select id="specU"><option value="256" selected>256</option><option value="230">230</option><option value="227">227</option></select></label></div><div class="mb-note" id="specNote"></div></details>
      <details><summary><span data-ui="f.flag">표식</span></summary><div class="row" id="fFlag"><button type="button" class="chip" data-k="edge" data-ui="fl.edge">경계 표시</button><button type="button" class="chip" data-k="complex" data-ui="fl.complex">복합</button><button type="button" class="chip" data-k="bold" data-ui="fl.bold">굵게</button><button type="button" class="chip" data-k="unseen" data-ui="fl.unseen">아직 안 본 장</button><button type="button" class="chip" data-k="chg" data-ui="fl.chg" id="chipChg" hidden>이 기준에서 바뀜</button></div></details>
    </div>
    <nav class="toc" id="toc"></nav>
  </aside>
  <main class="dx-main">
    <section class="dx-book" id="book"></section>
    <section class="dx-map" id="mapWrap" hidden>
      <div id="map"></div>
      <div class="mp-ctl">
        <div class="mp-box"><div class="k" data-ui="m.k">색칠 기준</div>
          <div class="seg" id="modeSeg"><button data-m="prim" class="is-on" data-ui="f.prim">자연 위해</button><button data-m="soc" data-ui="f.soc">사회 위해</button><button data-m="trait" data-ui="f.trait">특징</button><button data-m="inst" data-ui="f.inst">제도·조례</button><button data-m="thr" data-ui="f.thr.m">지원 문턱</button><button data-m="acc" data-ui="acc">대피 접근</button></div>
          <select id="modeSel" hidden></select>
        </div>
        <div class="mp-box"><div class="k"><span data-ui="m.lg">범례</span> <span id="lgNote"></span></div><div class="lg2" id="legend"></div></div>
      </div>
      <div class="mp-card" id="mpCard" hidden></div>
      <div class="mp-note" data-ui="m.note">색은 타입(범주)이지 위험 점수가 아닙니다 · 순위 없음<br>옅은 색 = 근접·희미(기준 미만) · 기록 없음 ≠ 안전</div>
    </section>
  </main>
</div>
<dialog id="unitDlg"><button class="x" id="unitX" aria-label="닫기">✕</button><h3 data-ui="unit.h">기초자치단체는 227곳인데 왜 256장인가요?</h3><div id="unitBody"></div></dialog>
<dialog id="dict"><button class="x" id="dictX" aria-label="닫기">✕</button><h3 data-ui="dict.h">타입 사전 · 규칙 한 줄</h3><table id="dictT"></table><p class="fine" style="margin:12px 0 0" id="dictFoot"></p></dialog>
<canvas id="cv" hidden></canvas>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script type="module" src="js/atlas.js?v=20261014g"></script>
</body>
</html>
