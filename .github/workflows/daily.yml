name: daily-ref

on:
  schedule:
    # 04:20 KST daily — 법령 본문·개정 감지 (LAW_OC 미설정 시 no-op)
    - cron: "20 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ref
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 복지 목록을 법령보다 먼저: 법령(law.go.kr)이 GitHub IP에서 간헐적으로
      # 매달려 잡 전체가 타임아웃 취소되던 이력(08-28~29) 때문. 각 스텝은 독립.
      - name: Fetch welfare service list
        continue-on-error: true
        env:
          DATA_WELFARE_KEY: ${{ secrets.DATA_WELFARE_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_welfare.py

      - name: Fetch law reference data
        continue-on-error: true
        timeout-minutes: 8
        env:
          # 시크릿 이름은 LAW_INFORM_KEY (사용자 지정), 스크립트 내부 env 이름은 LAW_OC
          LAW_OC: ${{ secrets.LAW_INFORM_KEY }}
        run: python scripts/fetch_daily.py

      - name: Commit if changed
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          [ -d data/ref/law ] && git add data/ref/law || true
          [ -f data/ref/welfare.json ] && git add data/ref/welfare.json || true
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "ref: law+welfare $(date -u +%F)"
          git push || (git pull --rebase && git push)
