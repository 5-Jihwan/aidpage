name: 지역 자료 정정 (대피소·행정구역 등)
description: 위치·이름·종류가 틀렸거나 없어진 시설
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: "시설 자료는 정부 원자료를 그대로 옮긴 것입니다. 원자료가 틀린 경우에도 알려 주시면 표시해 둡니다. 개인정보는 적지 마세요."
  - type: input
    id: region
    attributes: { label: "시·군·구 / 읍·면·동" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: "무엇이 어떻게 다른가요" }
    validations: { required: true }
