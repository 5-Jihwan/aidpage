name: daily-ref

on:
  schedule:
    # 04:20 KST daily — 법령 본문·개정 감지 (LAW_OC 미설정 시 no-op)
    - cron: "20 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ref
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 복지 목록(fetch_welfare)은 로컬 수집기(fetch_sd_live)가 단독 작성 —
      # 해외 러너에선 data.go.kr 접속이 자주 매달렸고(08-30~31), 이중 작성자는
      # -X theirs 리베이스와 충돌해 최신본을 덮을 수 있어 08-31 이관.
      - name: Fetch law reference data
        continue-on-error: true
        timeout-minutes: 8
        env:
          # 시크릿 이름은 LAW_INFORM_KEY (사용자 지정), 스크립트 내부 env 이름은 LAW_OC
          LAW_OC: ${{ secrets.LAW_INFORM_KEY }}
        run: python scripts/fetch_daily.py

      - name: Commit if changed
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          [ -d data/ref/law ] && git add data/ref/law || true
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "ref: law $(date -u +%F)"
          git push || (git pull --rebase && git push)
