<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AidPage 도감 · 시군구 타입</title>
<meta name="description" content="전국 시군구를 한 장씩 넘겨 보는 재난 타입 도감. 자연·사회 위해, 특징, 제도·조례를 지도에도 펼쳐 봅니다. 순위 없음.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%231a5fc4'/%3E%3Cg transform='translate(72 72) scale(0.7200)'%3E%3Cpath d='M256 40 96 104v152c0 108 68 176 160 216 92-40 160-108 160-216V104z' fill='%23fff'/%3E%3Ccircle cx='256' cy='176' r='30' fill='%231a5fc4'/%3E%3Crect x='228' y='228' width='56' height='150' rx='16' fill='%231a5fc4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css?v=20260907f">
<style>
  :root{--c-물:#2a67cf;--c-산:#66872a;--c-바다:#0f95a8;--c-마름:#c47f22;--c-평온:#b9c2cf;--c-교통:#c2447e;--c-trait:#9a7328;--c-inst:#0f4a9e;
    --rail-w:300px;--top-h:56px}
  html,body{height:100%}
  body{overflow:hidden;background:var(--bg2);font-size:15.5px}
  .dx-app{display:grid;grid-template-rows:var(--top-h) 1fr;grid-template-columns:var(--rail-w) 1fr;height:100vh;height:100dvh}
  /* ── top bar ── */
  .dx-top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line);z-index:5}
  .dx-top h1{font-family:var(--display);font-size:1.15rem;margin:0;white-space:nowrap}
  .dx-top h1 small{font-family:var(--mono);font-weight:400;font-size:.66rem;color:var(--mute);margin-left:8px}
  .dx-top .sp{flex:1}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg)}
  .seg button{white-space:nowrap;border:0;background:none;padding:5px 12px;border-radius:999px;font:inherit;font-size:.84rem;color:var(--mute);cursor:pointer}
  .seg button.is-on{background:var(--ink);color:#fff}
  .prog{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.7rem;color:var(--mute);white-space:nowrap}
  .prog i{display:block;width:90px;height:6px;border-radius:3px;background:var(--bg2);overflow:hidden;position:relative}
  .prog i::after{content:'';position:absolute;inset:0;width:var(--p,0%);background:var(--gold);border-radius:3px}
  .tbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font:inherit;font-size:.82rem;color:var(--text);cursor:pointer;white-space:nowrap}
  .tbtn:hover{background:var(--bg)}
  .tbtn.rail-toggle{display:none}
  /* ── rail ── */
  .dx-rail{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .dx-rail .dxq{margin:10px 12px 6px}
  .dx-rail input[type=search]{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:.9rem;background:var(--bg)}
  .flt{padding:0 12px 6px;border-bottom:1px solid var(--line)}
  .flt details{margin:0} .flt summary{cursor:pointer;font-family:var(--mono);font-size:.68rem;color:var(--mute);letter-spacing:.05em;padding:4px 0;list-style:none;display:flex;justify-content:space-between}
  .flt summary::-webkit-details-marker{display:none}
  .flt summary b{font-weight:500;color:var(--accent)}
  .flt .row{display:flex;flex-wrap:wrap;gap:4px;padding:2px 0 8px}
  .flt .chip{padding:3px 9px;font-size:.76rem;cursor:pointer;border-radius:999px} .flt .chip b{font-family:var(--mono);font-weight:400;margin-left:3px;opacity:.7}
  .flt .chip.is-on b{opacity:.9}
  .toc{overflow:auto;flex:1;padding:6px 0 30px;scroll-behavior:smooth}
  .toc .ch{margin:0}
  .toc .ch > button{width:100%;text-align:left;border:0;background:none;font:inherit;padding:8px 14px 4px;display:flex;align-items:baseline;gap:8px;cursor:pointer;font-family:var(--label);font-weight:700;font-size:.9rem;color:var(--ink)}
  .toc .ch > button small{font-family:var(--mono);font-weight:400;font-size:.66rem;color:var(--mute);margin-left:auto}
  .toc .ch > button.is-cur{color:var(--accent)}
  .toc ul{list-style:none;margin:0;padding:0}
  .toc li{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 18px;cursor:pointer;font-size:.86rem;color:var(--text);border-left:3px solid transparent}
  .toc li:hover{background:var(--bg)} .toc li.is-cur{background:#eef3fc;border-left-color:var(--accent);color:var(--ink);font-weight:600}
  .toc li .sw{width:10px;height:10px;border-radius:3px;flex:none;background:var(--c,var(--c-평온))}
  .toc li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toc li .ic{font-size:.8rem;opacity:.9} .toc li .seen{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none;opacity:0} .toc li.is-seen .seen{opacity:1}
  .toc li.dim{opacity:.35}
  .toc .empty{padding:20px 14px;color:var(--mute);font-size:.85rem}
  /* ── main ── */
  .dx-main{min-height:0;position:relative}
  .dx-book{height:100%;overflow:auto;padding:22px 26px 60px}
  /* spread */
  .sp{max-width:1080px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 1px 0 rgba(255,255,255,.9),0 12px 36px -18px rgba(20,32,46,.25);display:grid;grid-template-columns:300px 1fr;overflow:hidden;position:relative}
  .sp::before{content:'';position:absolute;left:300px;top:0;bottom:0;width:1px;background:linear-gradient(var(--line),transparent 30%,transparent 70%,var(--line))}
  .sp-l{padding:26px 22px;background:linear-gradient(180deg,#fbfcfe,#f3f6fb);display:flex;flex-direction:column;align-items:center;gap:14px}
  .sp-l .sil{width:100%;aspect-ratio:1;display:block;filter:drop-shadow(0 8px 14px rgba(20,32,46,.15))}
  .sp-l .sil path{fill:var(--tc);stroke:#fff;stroke-width:1.2;stroke-linejoin:round}
  .sp-l .sil path.hatch{fill:url(#hatch)}
  .sp-loc{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:14px}
  .sp-loc svg{width:70px;height:92px;flex:none} .sp-loc .kr{fill:#e6ecf5;stroke:#cdd8e8;stroke-width:.6} .sp-loc .me{fill:var(--tc);stroke:var(--tc);stroke-width:2;stroke-linejoin:round} .sp-loc .ring{fill:none;stroke:var(--tc);stroke-width:1.5;opacity:.6}
  .sp-loc .txt{font-size:.78rem;color:var(--mute);line-height:1.5} .sp-loc .txt b{display:block;font-family:var(--label);color:var(--ink);font-size:.9rem}
  .sp-code{font-family:var(--mono);font-size:.68rem;color:var(--mute);letter-spacing:.06em;text-align:center}
  .sp-r{padding:26px 30px 24px;min-width:0}
  .eyebrow{font-family:var(--mono);font-size:.7rem;color:var(--mute);letter-spacing:.05em;display:flex;gap:10px;flex-wrap:wrap}
  .sp-r h2{font-family:var(--display);font-size:2.4rem;line-height:1.05;margin:4px 0 2px;letter-spacing:-.02em;color:var(--ink)}
  .sp-r h2 small{font-family:var(--mono);font-weight:400;font-size:.75rem;color:var(--mute);margin-left:10px;letter-spacing:0}
  .sp-lab{font-family:var(--mono);font-size:.8rem;color:var(--mute);margin-bottom:14px}
  .types{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
  .tybox{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg);position:relative;overflow:hidden}
  .tybox::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tc,var(--c-평온))}
  .tybox .k{font-family:var(--mono);font-size:.64rem;color:var(--mute);letter-spacing:.06em;margin-bottom:4px}
  .tybox .v{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .tybox .v .big{font-family:var(--display);font-size:1.35rem;color:var(--ink)} .tybox .v .big i{font-style:normal;margin-right:4px}
  .tybox .d{font-size:.78rem;color:var(--mute);margin-top:4px;line-height:1.45}
  .tybox .none .big{color:var(--mute);font-weight:500}
  .ty-flag.basis{background:#e8effb;color:#0f4a9e} .ty-flag.edge{background:#fff3cd;color:#8a6d00} .ty-flag.bold{background:#14202e;color:#fff}
  .hz{font-family:var(--mono);font-size:.7rem;color:var(--mute);margin-top:6px} .hz b{font-weight:500;color:var(--ink)}
  .traits{margin:0 0 12px}
  .traits .k{font-family:var(--mono);font-size:.64rem;color:var(--mute);letter-spacing:.06em;margin-bottom:6px}
  .trait{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;padding:5px 0;border-top:1px dashed var(--line);font-size:.84rem;color:var(--mute)}
  .trait:last-child{border-bottom:1px dashed var(--line)}
  .trait .ty-chip{justify-self:start}
  .trait .none{color:var(--mute);font-size:.82rem}
  .sp-r h3{font-family:var(--label);font-size:.92rem;margin:16px 0 8px;padding-left:9px;border-left:3px solid var(--gold);display:flex;align-items:baseline;gap:8px}
  .sp-r h3 small{font-family:var(--mono);font-weight:400;font-size:.66rem;color:var(--mute)}
  .dxbars{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px}
  .bar{display:grid;grid-template-columns:1fr auto;gap:0 8px;font-size:.78rem;color:var(--mute);padding:3px 0}
  .bar .l{white-space:nowrap} .bar .l small{font-family:var(--mono);font-size:.6rem;color:var(--gold);margin-left:6px} .bar .n{font-family:var(--mono);color:var(--ink);font-weight:500;text-align:right;white-space:nowrap} .bar .n.over{color:var(--accent2)}
  .bar .t{grid-column:1/-1;height:7px;border-radius:4px;background:var(--bg2);position:relative;margin-top:3px}
  .bar .t i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#c7d3e6;width:var(--w)} .bar.over .t i{background:var(--accent)}
  .bar .t em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold);left:50%;border-radius:1px}
  .bar .t b.of{position:absolute;right:-12px;top:-4px;font-size:.7rem;color:var(--accent)}
  .bar.na .t i{width:0} .bar.na .n{color:var(--mute);font-weight:400}
  .dxbars .grp{grid-column:1/-1;font-family:var(--mono);font-size:.62rem;color:var(--mute);letter-spacing:.06em;margin-top:8px}
  .inst{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .it{border:1px solid var(--line);border-radius:12px;padding:8px 8px;font-size:.74rem;color:var(--mute);background:#fff;display:flex;flex-direction:column;gap:2px;min-height:56px}
  .it b{color:var(--ink);font-weight:600;font-size:.8rem;display:flex;gap:5px;align-items:center}
  .it small{font-family:var(--mono);font-size:.62rem} .it.has{background:#f2f6fd;border-color:#cfdcf4} .it.has b{color:var(--c-inst)} .it:not(.has){opacity:.55}
  .inst-sum{font-size:.82rem;color:var(--mute);margin-bottom:8px} .inst-sum b{color:var(--ink)}
  .sp-nav{display:flex;align-items:center;gap:8px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
  .sp-nav .nb{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font:inherit;font-size:.84rem;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;min-width:120px}
  .sp-nav .nb small{font-family:var(--mono);font-size:.6rem;color:var(--mute);letter-spacing:.05em} .sp-nav .nb:hover{background:var(--bg)} .sp-nav .nb.next{align-items:flex-end;margin-left:auto}
  .sp-nav .lk{display:flex;gap:12px;font-size:.82rem;width:100%;justify-content:center;margin-top:8px} .sp-nav .lk a,.sp-nav .lk button{color:var(--accent);background:none;border:0;font:inherit;font-size:.82rem;cursor:pointer;padding:0}
  .sp-foot{max-width:1080px;margin:14px auto 0;font-size:.74rem;color:var(--mute);line-height:1.6;text-align:center}
  /* chapter cover */
  .cov{max-width:1080px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px 34px}
  .cov h2{font-family:var(--display);font-size:2rem;margin:2px 0 4px} .cov .eyebrow{margin-bottom:2px}
  .cov .stat{display:flex;gap:26px;margin:10px 0 18px;font-size:.84rem;color:var(--mute)} .cov .stat b{display:block;font-family:var(--mono);font-size:1.3rem;color:var(--ink);font-weight:500}
  .stk{margin:10px 0 4px} .stk .k{font-family:var(--mono);font-size:.64rem;color:var(--mute);letter-spacing:.06em;margin-bottom:5px}
  .stk .bar2{display:flex;height:30px;border-radius:8px;overflow:hidden;gap:2px;background:var(--bg2)}
  .stk .bar2 span{display:flex;align-items:center;justify-content:center;font-size:.72rem;color:#fff;font-weight:600;background:var(--c,#c7d3e6);min-width:0;overflow:hidden;white-space:nowrap}
  .stk .bar2 span.lt{color:var(--ink)}
  .stk .lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.76rem;color:var(--mute);margin-top:6px} .stk .lg i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:4px;vertical-align:-1px}
  .cov .dxcards{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
  .cov .dxcards button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font:inherit;font-size:.8rem;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:5px} .cov .dxcards button i{width:8px;height:8px;border-radius:2px;background:var(--c)} .cov .dxcards button:hover{background:var(--bg)}
  .cov .cav{font-size:.76rem;color:var(--mute);margin-top:18px;line-height:1.6}
  /* ── map ── */
  .dx-map{height:100%;position:relative}
  #map{position:absolute;inset:0}
  .mp-ctl{position:absolute;top:12px;left:12px;z-index:2;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100% - 24px))}
  .mp-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--float-sm,0 6px 20px -10px rgba(20,32,46,.3))}
  .mp-box .k{font-family:var(--mono);font-size:.64rem;color:var(--mute);letter-spacing:.06em;margin-bottom:6px}
  .mp-box .seg{flex-wrap:wrap} .mp-box select{height:30px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:.8rem;padding:0 8px;background:#fff;margin-top:6px;max-width:100%}
  .lg2{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.78rem;color:var(--text)} .lg2 span{display:inline-flex;align-items:center;gap:5px} .lg2 i{width:12px;height:12px;border-radius:3px;background:var(--c);display:inline-block;border:1px solid rgba(0,0,0,.08)} .lg2 i.hatch{background:repeating-linear-gradient(135deg,#fff 0 2px,#b9c2cf 2px 4px)}
  .lg2 .n{font-family:var(--mono);font-size:.68rem;color:var(--mute)}
  .mp-card{position:absolute;left:12px;bottom:12px;z-index:2;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:240px;max-width:320px;box-shadow:0 12px 30px -14px rgba(20,32,46,.35)}
  .mp-card h4{font-family:var(--display);font-size:1.2rem;margin:0} .mp-card h4 small{font-family:var(--mono);font-weight:400;font-size:.66rem;color:var(--mute);margin-left:6px}
  .mp-card .ty-pair{margin:6px 0} .mp-card .tr{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
  .mp-card .go{display:flex;gap:10px;font-size:.8rem} .mp-card .go button,.mp-card .go a{color:var(--accent);background:none;border:0;font:inherit;font-size:.8rem;cursor:pointer;padding:0}
  .mp-card .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:1rem;color:var(--mute);cursor:pointer}
  .mp-note{position:absolute;right:12px;bottom:12px;z-index:2;font-size:.7rem;color:var(--mute);background:rgba(255,255,255,.85);padding:4px 8px;border-radius:8px;max-width:280px;text-align:right}
  .maplibregl-popup-content{font:inherit;font-size:.8rem;padding:6px 10px;border-radius:10px} .maplibregl-popup-content b{font-family:var(--label)}
  /* dict dialog */
  dialog{border:1px solid var(--line);border-radius:18px;padding:22px 24px;max-width:640px;width:calc(100% - 32px);box-shadow:0 20px 60px -20px rgba(20,32,46,.4)} dialog::backdrop{background:rgba(20,32,46,.35)}
  dialog h3{font-family:var(--display);margin:0 0 10px;font-size:1.2rem}
  dialog table{width:100%;border-collapse:collapse;font-size:.84rem} dialog td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top} dialog td:first-child{white-space:nowrap;font-weight:700}
  dialog .x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:1.1rem;cursor:pointer;color:var(--mute)}
  .kbd{font-family:var(--mono);font-size:.64rem;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--mute)}
  .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-family:var(--mono);font-size:.8rem}
  /* ── responsive ── */
  @media (max-width:980px){ .sp{grid-template-columns:1fr} .sp::before{display:none} .sp-l{flex-direction:row;align-items:center;padding:16px} .sp-l .sil{width:150px;flex:none} .sp-loc{flex:1} .sp-code{display:none} .sp-r{padding:18px 18px 20px} .sp-r h2{font-size:1.9rem} .dxbars{grid-template-columns:1fr} .inst{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:760px){ .dx-app{grid-template-columns:1fr} .dx-rail{position:fixed;top:var(--top-h);left:0;bottom:0;width:min(88vw,340px);z-index:6;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(20,32,46,.25)} .dx-app.rail-open .dx-rail{transform:none} .tbtn.rail-toggle{display:inline-block} .prog span{display:none} .dx-top h1 small{display:none} .dx-top{gap:6px;padding:0 8px} .dx-top h1{font-size:1rem} .tbtn .lbl{display:none} .tbtn .ico{display:inline!important} .tbtn{padding:5px 9px} .seg button{padding:5px 8px} .dx-book{padding:12px 10px 60px} .types{grid-template-columns:1fr} #rnd span{display:none} .mp-ctl{max-width:calc(100% - 24px)} }
</style>
</head>
<body>
<div class="dx-app" id="app">
  <header class="dx-top">
    <button class="tbtn rail-toggle" id="railBtn" aria-label="목록">☰ 목록</button>
    <h1>🧭 AidPage 도감<small id="ver"></small></h1>
    <div class="seg" id="viewSeg"><button data-view="book" class="is-on">📖 카드</button><button data-view="map">🗺️ 지도</button></div>
    <button class="tbtn" id="rnd" title="아무 시·군·구나 한 장">🎲 <span>아무 장이나</span></button>
    <span class="sp"></span>
    <div class="prog" title="이 브라우저에서 펼쳐 본 카드 수"><i id="progBar"></i><span id="progTxt"></span></div>
    <button class="tbtn" id="dictBtn"><span class="lbl">타입 사전</span><span class="ico" hidden>?</span></button>
    <a class="tbtn" href="./" title="본 사이트"><span class="lbl">← 본 사이트</span><span class="ico" hidden>←</span></a>
  </header>
  <aside class="dx-rail" id="rail">
    <div class="dxq"><input id="q" type="search" placeholder="시·군·구 검색 (예: 진안, 관악)" autocomplete="off"></div>
    <div class="flt">
      <details open><summary>자연 위해 <b id="nPrim"></b></summary><div class="row" id="fPrim"></div></details>
      <details><summary>사회 위해 <b id="nSoc"></b></summary><div class="row" id="fSoc"></div></details>
      <details><summary>특징 <b id="nTrait"></b></summary><div class="row" id="fTrait"></div></details>
      <details><summary>제도·조례 <b id="nInst"></b></summary><div class="row" id="fInst"></div></details>
      <details><summary>표식</summary><div class="row" id="fFlag"><button type="button" class="chip" data-k="edge">경계 표시</button><button type="button" class="chip" data-k="zone">지정 근거</button><button type="button" class="chip" data-k="complex">복합</button><button type="button" class="chip" data-k="unseen">아직 안 본 장</button></div></details>
    </div>
    <nav class="toc" id="toc"></nav>

        ${bar('65세 이상', m.e65, TH.e65, pct)}${bar('65세 이상 1인세대', m.ealone, TH.ealone, pct)}${bar('1인세대', m.single, TH.single80, pct, { tl: '상위 20%' })}${bar('인구밀도', m.dens, TH.dens, v => v == null ? '—' : num(v) + '/km²')}${bar('외국인 주민', m.foreign_r, TH.foreign_r, pct)}${bar('장애·아동', m.disabled_r, TH.disabled_r, pct)}${bar('수급·주거취약', m.basic_r, TH.basic_r, pct)}
        <div class="grp">사회 · 같은 ${esc(s.kind)} 유형 안 기준</div>
        ${bar('교통 사망+중상/10만', m.traffic_r, s.social_q?.traffic_r, v => num(v))}<div class="bar na"><span class="l">화재</span><span class="n">자료 대기</span><span class="t"><i></i></span></div>
      </div>
      <h3>제도·조례 <small>국가법령정보센터 자치법규 · 보유 여부만</small></h3>
      ${instHtml}
      <div class="sp-nav" id="spNav"></div>
    </div>
  </article>
  <div class="sp-foot">인구 ${num(m.pop)}명 · 자료: ${esc(Object.values(T.meta.sources || {}).slice(0, 3).join(' / '))}<br>같은 단위 전국 상위 25% 임계에 따른 설명형 분류입니다. 순위가 아니며, 기록이 없다는 것이 안전하다는 뜻은 아닙니다.</div>`;
}
let cur = null, curSido = null;
function show(code, keep = false) {
  const r = byCode[code]; if (!r) return; cur = code; curSido = null;
  if (!keep) { $('#app').classList.remove('rail-open'); }
  $('#book').innerHTML = card(r);
  const list = visible.length ? visible : rows; const i = list.findIndex(x => x.code === code);
  const prev = list[(i - 1 + list.length) % list.length], next = list[(i + 1) % list.length];
  $('#spNav').innerHTML = `<button type="button" class="nb prev" data-c="${prev.code}"><small>◀ 이전</small>${ICON[prev.s.primary]} ${esc(prev.i.name)}</button><button type="button" class="nb next" data-c="${next.code}"><small>다음 ▶</small>${ICON[next.s.primary]} ${esc(next.i.name)}</button><div class="lk"><button type="button" id="toMap">🗺️ 도감 지도에서 위치 보기</button><a href="./#g?sgg=${r.code}">본 사이트 지도 →</a><a href="./#g?sgg=${r.code}&view=region">이 지역은 →</a></div>`;
  $$('#spNav .nb').forEach(b => b.addEventListener('click', () => { show(b.dataset.c); $('#book').scrollTop = 0; }));
  $('#toMap').addEventListener('click', () => { setView('map'); focusMap(code); });
  $$('#toc li').forEach(li => li.classList.toggle('is-cur', li.dataset.c === code)); $$('#toc .ch > button').forEach(b => b.classList.remove('is-cur'));
  if (!keep) { $(`#toc li[data-c="${code}"]`)?.scrollIntoView({ block: 'nearest' }); $('#book').scrollTop = 0; markSeen(code); history.replaceState(null, '', '#c=' + code); }
  if (map && view === 'map') focusMap(code);
}
function showCover(sc) {
  const c = sidos.find(x => x.code === sc); if (!c) return; cur = null; curSido = sc; $('#app').classList.remove('rail-open');
  const sd = SD && SD.sido ? SD.sido[sc] : null;
  const stack = (obj, lab, colOf) => { const ents = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]); return `<div class="stk"><div class="k">${lab}</div><div class="bar2">${ents.map(([k, v]) => `<span style="flex:${v};--c:${colOf(k)}" class="${colOf(k) === COL.none || k === '평온' ? 'lt' : ''}" title="${esc(k)} ${v}%">${v >= 9 ? `${ICON[k] || ''} ${k === '—' ? '없음' : k} ${Math.round(v)}%` : ''}</span>`).join('')}</div><div class="lg">${ents.map(([k, v]) => `<span><i style="--c:${colOf(k)}"></i>${ICON[k] || ''} ${k === '—' ? '없음' : k} ${v}%</span>`).join('')}</div></div>`; };
  const goldRamp = ['#9a7328', '#b58f4a', '#c9a86e', '#d9c194', '#e8d8b8', '#f0e6d2', '#f6f0e4'];
  const secCol = (() => { let i = 0; const m = {}; return k => k === '—' ? COL.none : (m[k] ??= goldRamp[Math.min(i++, goldRamp.length - 1)]); })();
  $('#book').innerHTML = `<div class="cov"><div class="eyebrow"><span>챕터</span><span>${c.rows.length}개 시·군·구</span></div><h2>${esc(c.name)}</h2>
    <div class="stat"><div><b>${c.rows.length}</b>시·군·구</div>${sd ? `<div><b>${num(sd.pop)}</b>인구(주민등록)</div>` : ''}<div><b>${c.rows.filter(r => seen.has(r.code)).length}/${c.rows.length}</b>펼쳐 본 장</div></div>
    ${sd ? stack(sd.primary_pct, '자연 위해 타입 분포 · 인구 가중 %', k => COL[k] || COL.none) + stack(sd.social_pct, '사회 위해 분포 · 인구 가중 %', k => k === '—' ? COL.none : COL[k]) + stack(sd.secondary_pct, '특징(첫째) 분포 · 인구 가중 %', secCol) : '<p class="fine">시·도 분포 자료 없음</p>'}
    <p class="fine" style="margin:12px 0 0">시·도에는 단일 타입을 붙이지 않습니다. 아래 카드는 이름순입니다.</p>
    <div class="dxcards">${c.rows.map(r => `<button type="button" data-c="${r.code}" style="--c:${COL[r.s.primary]}"><i></i>${ICON[r.s.primary]} ${esc(r.i.name)}${r.s.social ? ' ' + ICON[r.s.social] : ''}</button>`).join('')}</div>
    ${SD && SD.meta && SD.meta.caveats ? `<div class="cav">${SD.meta.caveats.map(x => '· ' + esc(x)).join('<br>')}</div>` : ''}</div>`;
  $$('#book .dxcards button').forEach(b => b.addEventListener('click', () => show(b.dataset.c)));
  $$('#toc li').forEach(li => li.classList.remove('is-cur')); $$('#toc .ch > button').forEach(b => b.classList.toggle('is-cur', b.parentElement.dataset.s === sc));
  $('#book').scrollTop = 0; history.replaceState(null, '', '#s=' + sc);
}
function random() { const list = visible.length ? visible : rows; const pool = list.filter(r => !seen.has(r.code)); const pick = (pool.length ? pool : list)[Math.floor(Math.random() * (pool.length ? pool : list).length)]; show(pick.code); }
$('#rnd').addEventListener('click', random);

/* ── map ── */
let map = null, view = 'book', mode = 'prim', modeArg = null, hoverCode = null;
function setView(v) {
  view = v; $$('#viewSeg button').forEach(b => b.classList.toggle('is-on', b.dataset.view === v));
  $('#book').hidden = v !== 'book'; $('#mapWrap').hidden = v !== 'map';
  if (v === 'map') { initMap(); requestAnimationFrame(() => map && map.resize()); if (cur) focusMap(cur); }
}
$$('#viewSeg button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
function initMap() {
  if (map) return;
  map = new maplibregl.Map({ container: 'map', style: 'https://tiles.openfreemap.org/styles/positron', bounds: [[124.6, 33.0], [131.9, 38.7]], fitBoundsOptions: { padding: 30 }, attributionControl: { compact: true }, maxZoom: 12, minZoom: 5 });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
  map.on('load', () => { geoP.then(mapAddData); });
}
function mapAddData() {
  if (!map || !GEO || map.getSource('sgg') || !map.isStyleLoaded()) { if (map && GEO && !map.getSource('sgg')) map.once('idle', mapAddData); return; }
  map.addSource('sgg', { type: 'geojson', data: GEO, promoteId: 'code' });
  map.addSource('sido', { type: 'geojson', data: SIDO });
  const before = map.getStyle().layers.find(l => l.type === 'symbol')?.id;
  map.addLayer({ id: 'sgg-fill', type: 'fill', source: 'sgg', paint: { 'fill-color': '#ccc', 'fill-opacity': 0.55 } }, before);
  map.addLayer({ id: 'sgg-line', type: 'line', source: 'sgg', paint: { 'line-color': '#fff', 'line-width': 0.6, 'line-opacity': 0.8 } }, before);
  map.addLayer({ id: 'sido-line', type: 'line', source: 'sido', paint: { 'line-color': '#14202e', 'line-width': 1, 'line-opacity': 0.35 } }, before);
  map.addLayer({ id: 'sgg-hover', type: 'line', source: 'sgg', paint: { 'line-color': '#14202e', 'line-width': 2 }, filter: ['==', ['get', 'code'], '__none__'] }, before);
  map.addLayer({ id: 'sgg-sel', type: 'line', source: 'sgg', paint: { 'line-color': '#1a5fc4', 'line-width': 3 }, filter: ['==', ['get', 'code'], '__none__'] }, before);
  const pop = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 8 });
  map.on('mousemove', 'sgg-fill', e => { const f = e.features[0]; const r = byCode[f.properties.code]; if (!r) return; map.getCanvas().style.cursor = 'pointer'; if (hoverCode !== r.code) { hoverCode = r.code; map.setFilter('sgg-hover', ['==', ['get', 'code'], r.code]); } pop.setLngLat(e.lngLat).setHTML(`<b>${esc(r.i.name)}</b> <span style="color:#566577">${esc(r.i.sido_name || '').slice(0, 2)}</span><br>${ICON[r.s.primary]} ${r.s.primary}${r.s.social ? ` · ${ICON[r.s.social]} ${r.s.social}` : ''}${(r.s.traits || []).length ? `<br><span style="color:#9a7328">${r.s.traits.map(t => ICON[t] + t).join(' ')}</span>` : ''}`).addTo(map); });
  map.on('mouseleave', 'sgg-fill', () => { map.getCanvas().style.cursor = ''; hoverCode = null; map.setFilter('sgg-hover', ['==', ['get', 'code'], '__none__']); pop.remove(); });
  map.on('click', 'sgg-fill', e => { const r = byCode[e.features[0].properties.code]; if (r) { cur = r.code; markSeen(r.code); $$('#toc li').forEach(li => li.classList.toggle('is-cur', li.dataset.c === r.code)); focusMap(r.code, true); history.replaceState(null, '', '#m=' + r.code); } });
  paintMap(); if (cur) focusMap(cur);
}
function colorExpr() {
  const vis = new Set(visible.map(r => r.code));
  const pairs = []; rows.forEach(r => { let c = COL.none; if (mode === 'prim') c = COL[r.s.primary]; else if (mode === 'soc') c = r.s.social ? COL[r.s.social] : COL.none; else if (mode === 'trait') c = modeArg ? ((r.s.traits || []).includes(modeArg) ? COL.trait : COL.none) : COL.none; else if (mode === 'inst') c = modeArg && r.o && r.o.ord[modeArg] ? COL.inst : COL.none; pairs.push(r.code, c); });
  const op = []; rows.forEach(r => op.push(r.code, vis.has(r.code) ? 0.6 : 0.06));
  return { color: ['match', ['get', 'code'], ...pairs, COL.none], op: ['match', ['get', 'code'], ...op, 0.05] };
}
function paintMap() {
  if (!map || !map.getLayer('sgg-fill')) return; const e = colorExpr(); map.setPaintProperty('sgg-fill', 'fill-color', e.color); map.setPaintProperty('sgg-fill', 'fill-opacity', e.op);
  const vis = visible;
  const cnt = fn => { const c = {}; vis.forEach(r => { const k = fn(r); if (k) c[k] = (c[k] || 0) + 1; }); return c; };
  let lg = '';
  if (mode === 'prim') { const c = cnt(r => r.s.primary); lg = ['물', '산', '바다', '마름', '평온'].map(k => `<span><i class="${k === '평온' ? 'hatch' : ''}" style="--c:${COL[k]}"></i>${ICON[k]} ${k}<span class="n">${c[k] || 0}</span></span>`).join(''); }
  else if (mode === 'soc') { const c = cnt(r => r.s.social || '—'); lg = `<span><i style="--c:${COL['교통']}"></i>🚗 교통<span class="n">${c['교통'] || 0}</span></span><span><i style="--c:${COL.none}"></i>해당 없음<span class="n">${c['—'] || 0}</span></span>`; }
  else if (mode === 'trait') { const n = modeArg ? vis.filter(r => (r.s.traits || []).includes(modeArg)).length : 0; lg = `<span><i style="--c:${COL.trait}"></i>${ICON[modeArg] || ''} ${modeArg || '특징 선택'}<span class="n">${n}</span></span><span><i style="--c:${COL.none}"></i>해당 없음<span class="n">${vis.length - n}</span></span>`; }
  else { const n = modeArg ? vis.filter(r => r.o && r.o.ord[modeArg]).length : 0; lg = `<span><i style="--c:${COL.inst}"></i>${modeArg ? INST[modeArg][1] + ' ' + INST[modeArg][0] + ' 보유' : '표식 선택'}<span class="n">${n}</span></span><span><i style="--c:${COL.none}"></i>없음<span class="n">${vis.length - n}</span></span>`; }
  $('#legend').innerHTML = lg;
}
$$('#modeSeg button').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.m; $$('#modeSeg button').forEach(x => x.classList.toggle('is-on', x === b));
  const sel = $('#modeSel');
  if (mode === 'trait') { sel.hidden = false; sel.innerHTML = TRAITS.map(k => `<option value="${k}">${ICON[k]} ${k} — ${esc(D(k))}</option>`).join(''); modeArg = sel.value; }
  else if (mode === 'inst') { sel.hidden = false; sel.innerHTML = Object.entries(INST).map(([k, [l, ic]]) => `<option value="${k}">${ic} ${l}</option>`).join(''); modeArg = sel.value; }
  else { sel.hidden = true; modeArg = null; }
  paintMap();
}));
$('#modeSel').addEventListener('change', e => { modeArg = e.target.value; paintMap(); });
function focusMap(code, quiet = false) {
  const r = byCode[code]; if (!map || !r) return;
  if (map.getLayer('sgg-sel')) map.setFilter('sgg-sel', ['==', ['get', 'code'], code]);
  if (r.i.lat != null && !quiet) map.flyTo({ center: [r.i.lon, r.i.lat], zoom: Math.max(map.getZoom(), 8.5), duration: 900 });
  const c = $('#mpCard'); c.hidden = false;
  c.innerHTML = `<button class="x" id="mpX" aria-label="닫기">✕</button><h4>${ICON[r.s.primary]} ${esc(r.i.name)}<small>${esc(r.i.sido_name || '')}</small></h4>
    <div class="ty-pair"><span class="ty-chip ty-p${r.s.bold ? ' bold' : ''}">${ICON[r.s.primary]} ${r.s.primary}</span>${r.s.basis === 'zone' ? '<span class="ty-flag basis">지정</span>' : ''}${r.s.complex ? '<span class="ty-flag">복합</span>' : ''}<i class="ty-dot">·</i>${r.s.social ? `<span class="ty-chip ty-s2">${ICON[r.s.social]} ${r.s.social}</span>` : '<span class="ty-chip ty-s2 none">—</span>'}</div>
    <div class="tr">${(r.s.traits || []).map(k => `<span class="ty-chip ty-t sm">${ICON[k]} ${k}</span>`).join('') || '<span class="ty-chip ty-t sm none">특징 없음</span>'}</div>
    ${r.o ? `<div class="fine">자치법규 ${r.o.n}건 · ${INST_MAIN.filter(k => r.o.ord[k]).map(k => INST[k][1]).join(' ') || '표식 없음'}</div>` : ''}
    <div class="go"><button type="button" id="mpOpen">📖 카드 펼치기 →</button><a href="./#g?sgg=${r.code}&view=region">이 지역은 →</a></div>`;
  $('#mpX').addEventListener('click', () => { c.hidden = true; map.setFilter('sgg-sel', ['==', ['get', 'code'], '__none__']); });
  $('#mpOpen').addEventListener('click', () => { setView('book'); show(r.code); });
}

/* ── dict, rail, keys, hash ── */
$('#dictT').innerHTML = ['물', '산', '바다', '마름', '평온', '교통', '화재', ...TRAITS].map(k => `<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${COL[k] || COL.trait};margin-right:6px;vertical-align:-1px"></span>${ICON[k]} ${k}</td><td>${esc(D(k))}</td></tr>`).join('') + `<tr><td>굵게</td><td>인구밀도 상위 25% — 노출이 큼 (주 타입이 평온이면 미적용)</td></tr><tr><td>지정</td><td>${esc(D('basis.zone'))}</td></tr><tr><td>복합</td><td>${esc(D('complex'))}</td></tr><tr><td>경계</td><td>${esc(D('edge'))}</td></tr>`;
$('#dictBtn').addEventListener('click', () => $('#dict').showModal()); $('#dictX').addEventListener('click', () => $('#dict').close());
$('#railBtn').addEventListener('click', () => $('#app').classList.toggle('rail-open'));
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea') || $('#dict').open) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const list = visible.length ? visible : rows; const i = cur ? list.findIndex(x => x.code === cur) : -1; const n = list[((i < 0 ? 0 : i) + (e.key === 'ArrowRight' ? 1 : -1) + list.length) % list.length]; if (n) { if (view === 'map') { cur = n.code; focusMap(n.code); } else show(n.code); } }
  else if (e.key === 'r' || e.key === 'R') random(); else if (e.key === 'm' || e.key === 'M') setView(view === 'map' ? 'book' : 'map');
});
applyFilters();
const h = location.hash;
if (h.startsWith('#c=') && byCode[h.slice(3)]) show(h.slice(3));
else if (h.startsWith('#s=') && sidos.find(x => x.code === h.slice(3))) showCover(h.slice(3));
else if (h.startsWith('#m=') && byCode[h.slice(3)]) { cur = h.slice(3); setView('map'); }
else showCover(sidos[0].code);
</script>
