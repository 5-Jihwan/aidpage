name: live-data

on:
  schedule:
    # Baseline every 30 min (UTC). GitHub minimum is 5 min; see data/live/README.md
    # for switching to "*/10 * * * *" during active 호우/태풍/대설 경보 (.hot flag).
    # 10분마다 깨어나되, 평시엔 정시·30분 슬롯만 실제 수집한다.
    # 호우/태풍/대설 경보 발효(.hot 플래그) 중에는 매 10분 수집 — 경보가 곧 스위치다.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Gate — full cadence only while a severe warning is active
        id: gate
        run: |
          MIN=$(date -u +%M)
          if [ "$MIN" -lt 10 ] || { [ "$MIN" -ge 30 ] && [ "$MIN" -lt 40 ]; }; then
            echo "run=true"  >> "$GITHUB_OUTPUT"   # 평시 30분 슬롯
          elif [ -f data/live/.hot ]; then
            echo "run=true"  >> "$GITHUB_OUTPUT"   # 경보 발효 중 → 10분 주기
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skip: off-slot and no active severe warning"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Fetch live data
        if: steps.gate.outputs.run == 'true'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SAFETYDATA_KEY: ${{ secrets.SAFETYDATA_KEY }}
          HRFCO_KEY: ${{ secrets.HRFCO_KEY }}
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
          JUSO_KEY: ${{ secrets.JUSO_KEY }}
          TAAS_API: ${{ secrets.TAAS_API }}
          SD_KEY_WARN: ${{ secrets.SD_KEY_WARN }}
          SD_KEY_PREWARN: ${{ secrets.SD_KEY_PREWARN }}
          SD_KEY_WARNZONE: ${{ secrets.SD_KEY_WARNZONE }}
          SD_KEY_LS_PRED: ${{ secrets.SD_KEY_LS_PRED }}
          SD_KEY_LS_FCST: ${{ secrets.SD_KEY_LS_FCST }}
          SD_KEY_LS_HIST: ${{ secrets.SD_KEY_LS_HIST }}
          SD_KEY_FLOOD: ${{ secrets.SD_KEY_FLOOD }}
          SD_KEY_FLOOD_DEPTH: ${{ secrets.SD_KEY_FLOOD_DEPTH }}
          SD_KEY_FLOOD_LINE: ${{ secrets.SD_KEY_FLOOD_LINE }}
          SD_KEY_FLOOD_SITU: ${{ secrets.SD_KEY_FLOOD_SITU }}
          SD_KEY_RISKZONE: ${{ secrets.SD_KEY_RISKZONE }}
          SD_KEY_RISKZONE2: ${{ secrets.SD_KEY_RISKZONE2 }}
        run: python scripts/fetch_live.py

      - name: Report cadence hint
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -f data/live/.hot ]; then
            echo "::warning title=HOT::Active 호우/태풍/대설 경보 - consider switching cron to */10 (see data/live/README.md)"
          fi

      - name: Commit if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "live-bot"
          git config user.email "live-bot@users.noreply.github.com"
          git add data/live/weather.json data/live/alerts.json data/live/air.json
          [ -f data/live/er.json ] && git add data/live/er.json || true
          [ -f data/live/air_stations.json ] && git add data/live/air_stations.json || true
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "live $(date -u +%FT%H:%M)"
          # retry once in case something else pushed meanwhile
          git push || (git pull --rebase && git push)
